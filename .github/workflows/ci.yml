name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: qsystem-packages

jobs:
  contracts:
    name: contracts (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: qsystem-packages/pnpm-lock.yaml
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm --filter @qsystem/contracts test
      - run: corepack pnpm --filter @qsystem/contracts exec tsc --noEmit

  ui:
    name: ui (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: qsystem-packages/pnpm-lock.yaml
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm --filter @qsystem/ui test
      - run: corepack pnpm --filter @qsystem/ui exec tsc --noEmit

  api:
    name: api (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qsystem
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'ci-postgres-password' }}
          POSTGRES_DB: qsystem
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qsystem -d qsystem"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      meilisearch:
        image: getmeili/meilisearch
        env:
          MEILI_MASTER_KEY: ${{ secrets.CI_MEILI_MASTER_KEY || 'ci-meili-master-key-32-chars-min-000' }}
          MEILI_NO_ANALYTICS: 'true'
        ports:
          - 7700:7700
      s3:
        image: rustfs/rustfs:latest
        env:
          MINIO_ROOT_USER: ${{ secrets.CI_S3_USER || 'ciadmin' }}
          MINIO_ROOT_PASSWORD: ${{ secrets.CI_S3_PASSWORD || 'ciadmin-password' }}
        ports:
          - 9000:9000
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://qsystem_app:ci-app-password@localhost:5432/qsystem?schema=public
      RLS_OWNER_URL: postgresql://qsystem:${{ secrets.CI_POSTGRES_PASSWORD || 'ci-postgres-password' }}@localhost:5432/qsystem?schema=public
      QSYSTEM_APP_PASSWORD: ci-app-password
      JWT_SECRET: ci-test-jwt-secret-64-hex-chars-do-not-reuse-in-prod
      TEST_JWT_SECRET: ci-test-jwt-secret-64-hex-chars-do-not-reuse-in-prod
      NODE_ENV: test
      MEILI_URL: http://localhost:7700
      MEILI_MASTER_KEY: ${{ secrets.CI_MEILI_MASTER_KEY || 'ci-meili-master-key-32-chars-min-000' }}
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: qsystem-docs
      S3_ACCESS_KEY: ${{ secrets.CI_S3_USER || 'ciadmin' }}
      S3_SECRET_KEY: ${{ secrets.CI_S3_PASSWORD || 'ciadmin-password' }}
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: qsystem-packages/pnpm-lock.yaml
      - run: corepack pnpm install --frozen-lockfile
      - name: Migrate (owner connection) + verify migration status + set restricted role
        run: |
          DATABASE_URL="$RLS_OWNER_URL" corepack pnpm --filter api db:migrate:deploy
          DATABASE_URL="$RLS_OWNER_URL" corepack pnpm --filter api exec prisma migrate status
          psql "$RLS_OWNER_URL" -c "ALTER ROLE qsystem_app WITH LOGIN PASSWORD 'ci-app-password'"
      - name: Generate Prisma client
        run: corepack pnpm --filter api db:generate
      - name: Build & Typecheck API
        run: |
          corepack pnpm --filter api build
          corepack pnpm --filter api typecheck
      - name: API suite (sequential)
        run: corepack pnpm --filter api test
      - name: API startup & health smoke check
        run: |
          node apps/api/dist/main.js &
          API_PID=$!
          trap "kill $API_PID || true" EXIT
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3001/health/live >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:3001/health/live | grep -q '"ok":true'
          curl -sf http://127.0.0.1:3001/health/ready | grep -q '"ok":true'

  web:
    name: Web (test + typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: qsystem-packages/pnpm-lock.yaml
      - run: corepack pnpm install --frozen-lockfile
      - name: Build shared contracts
        run: corepack pnpm --filter @qsystem/contracts build
      - name: Web unit tests & typecheck
        run: |
          corepack pnpm --filter web test
          corepack pnpm --filter web exec tsc --noEmit
      - name: Next.js production build
        env:
          QSYSTEM_API_URL: http://127.0.0.1:3001
        run: corepack pnpm --filter web build

  playwright:
    name: Playwright Responsive Dark/Light E2E
    runs-on: ubuntu-latest
    needs: [api, web]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qsystem
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'ci-postgres-password' }}
          POSTGRES_DB: qsystem
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qsystem -d qsystem"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      meilisearch:
        image: getmeili/meilisearch
        env:
          MEILI_MASTER_KEY: ${{ secrets.CI_MEILI_MASTER_KEY || 'ci-meili-master-key-32-chars-min-000' }}
          MEILI_NO_ANALYTICS: 'true'
        ports:
          - 7700:7700
      s3:
        image: rustfs/rustfs:latest
        env:
          MINIO_ROOT_USER: ${{ secrets.CI_S3_USER || 'ciadmin' }}
          MINIO_ROOT_PASSWORD: ${{ secrets.CI_S3_PASSWORD || 'ciadmin-password' }}
        ports:
          - 9000:9000
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://qsystem_app:ci-app-password@localhost:5432/qsystem?schema=public
      RLS_OWNER_URL: postgresql://qsystem:${{ secrets.CI_POSTGRES_PASSWORD || 'ci-postgres-password' }}@localhost:5432/qsystem?schema=public
      JWT_SECRET: ci-test-jwt-secret-64-hex-chars-do-not-reuse-in-prod
      MEILI_URL: http://localhost:7700
      MEILI_MASTER_KEY: ${{ secrets.CI_MEILI_MASTER_KEY || 'ci-meili-master-key-32-chars-min-000' }}
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: qsystem-docs
      S3_ACCESS_KEY: ${{ secrets.CI_S3_USER || 'ciadmin' }}
      S3_SECRET_KEY: ${{ secrets.CI_S3_PASSWORD || 'ciadmin-password' }}
      REDIS_URL: redis://localhost:6379
      E2E_EMAIL: e2e-director@qsystem.local
      E2E_PASSWORD: ${{ secrets.CI_E2E_PASSWORD || 'ci-e2e-director-pass-2026' }}
      QSYSTEM_API_URL: http://127.0.0.1:3001
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: qsystem-packages/pnpm-lock.yaml
      - run: corepack pnpm install --frozen-lockfile
      - name: Migrate & build runtime apps
        run: |
          DATABASE_URL="$RLS_OWNER_URL" corepack pnpm --filter api db:migrate:deploy
          psql "$RLS_OWNER_URL" -c "ALTER ROLE qsystem_app WITH LOGIN PASSWORD 'ci-app-password'"
          corepack pnpm --filter @qsystem/contracts build
          corepack pnpm --filter api db:generate
          corepack pnpm --filter api build
          corepack pnpm --filter web build
      - name: Install Playwright Chromium
        run: corepack pnpm --filter web exec playwright install chromium --with-deps
      - name: Boot API + Web and run Playwright E2E
        run: |
          node apps/api/dist/main.js &
          API_PID=$!
          corepack pnpm --filter web start &
          WEB_PID=$!
          trap "kill $API_PID $WEB_PID || true" EXIT
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3001/health/live >/dev/null && curl -sf http://127.0.0.1:3000/login >/dev/null; then
              break
            fi
            sleep 1
          done
          corepack pnpm --filter web exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-artifacts
          path: qsystem-packages/apps/web/test-results

  containers:
    name: Container Build & Health Smoke
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: qsystem-packages
          file: qsystem-packages/apps/api/Dockerfile
          push: false
          load: true
          tags: qsystem-api:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: qsystem-packages
          file: qsystem-packages/apps/web/Dockerfile
          push: false
          load: true
          tags: qsystem-web:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container /health/live and /login smoke check
        run: |
          docker run -d --name qsystem-api-smoke -p 3101:3001 \
            -e APP_ENV=staging \
            -e PORT=3001 \
            -e DATABASE_URL=postgresql://qsystem_app:smoke@127.0.0.1:5432/qsystem \
            -e JWT_SECRET=ci-smoke-jwt-secret-32-chars-minimum-000 \
            -e S3_ENDPOINT=http://127.0.0.1:9000 \
            -e S3_BUCKET=qsystem-docs \
            -e S3_ACCESS_KEY=smokeadmin \
            -e S3_SECRET_KEY=smokesecretkey \
            -e MEILI_URL=http://127.0.0.1:7700 \
            -e MEILI_MASTER_KEY=smoke-meili-key-12345 \
            qsystem-api:ci-${{ github.sha }}
          docker run -d --name qsystem-web-smoke -p 3100:3000 \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e QSYSTEM_API_URL=http://127.0.0.1:3101 \
            qsystem-web:ci-${{ github.sha }}
          trap "docker rm -f qsystem-api-smoke qsystem-web-smoke || true" EXIT
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:3101/health/live >/dev/null && curl -sf http://127.0.0.1:3100/login >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:3101/health/live | grep -q '"ok":true'
          curl -sf http://127.0.0.1:3100/login >/dev/null

  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    needs: [contracts, ui, api, web, playwright, containers]
    if: always()
    steps:
      - name: Require every quality gate
        run: |
          test "${{ needs.contracts.result }}" = success
          test "${{ needs.ui.result }}" = success
          test "${{ needs.api.result }}" = success
          test "${{ needs.web.result }}" = success
          test "${{ needs.playwright.result }}" = success
          test "${{ needs.containers.result }}" = success

  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: [release-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_CONTAINER_DEPLOY == 'true'
    environment: staging
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable API & Web images
        run: |
          IMAGE_TAG="sha-${{ github.sha }}"
          docker build -f apps/api/Dockerfile -t "ghcr.io/${{ github.repository_owner }}/qsystem-api:${IMAGE_TAG}" .
          docker build -f apps/web/Dockerfile -t "ghcr.io/${{ github.repository_owner }}/qsystem-web:${IMAGE_TAG}" .
          docker push "ghcr.io/${{ github.repository_owner }}/qsystem-api:${IMAGE_TAG}"
          docker push "ghcr.io/${{ github.repository_owner }}/qsystem-web:${IMAGE_TAG}"
      - name: Trigger staging deploy & verify /health/ready
        env:
          WEBHOOK_URL: ${{ secrets.STAGING_DEPLOY_WEBHOOK }}
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ] || [ -z "$STAGING_URL" ]; then
            echo "Missing STAGING_DEPLOY_WEBHOOK secret or STAGING_URL variable" >&2
            exit 1
          fi
          curl -fsSL -X POST -H "Authorization: Bearer ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"tag\":\"sha-${{ github.sha }}\",\"environment\":\"staging\"}" \
            "$WEBHOOK_URL"
          for i in $(seq 1 30); do
            if curl -fsSL "${STAGING_URL}/api/health/ready" | grep -q '"ok":true'; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Trigger staging rollback on failure
        if: failure()
        env:
          ROLLBACK_URL: ${{ secrets.STAGING_ROLLBACK_WEBHOOK }}
        run: |
          if [ -n "$ROLLBACK_URL" ]; then
            curl -fsSL -X POST -H "Authorization: Bearer ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}" "$ROLLBACK_URL"
          fi

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_CONTAINER_DEPLOY == 'true'
    environment: production
    steps:
      - name: Trigger production rollout & verify /health/ready
        env:
          WEBHOOK_URL: ${{ secrets.PROD_DEPLOY_WEBHOOK }}
          PROD_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ] || [ -z "$PROD_URL" ]; then
            echo "Missing PROD_DEPLOY_WEBHOOK secret or PRODUCTION_URL variable" >&2
            exit 1
          fi
          curl -fsSL -X POST -H "Authorization: Bearer ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"tag\":\"sha-${{ github.sha }}\",\"environment\":\"production\"}" \
            "$WEBHOOK_URL"
          for i in $(seq 1 30); do
            if curl -fsSL "${PROD_URL}/api/health/ready" | grep -q '"ok":true'; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Trigger production rollback on failure
        if: failure()
        env:
          ROLLBACK_URL: ${{ secrets.PROD_ROLLBACK_WEBHOOK }}
        run: |
          if [ -n "$ROLLBACK_URL" ]; then
            curl -fsSL -X POST -H "Authorization: Bearer ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}" "$ROLLBACK_URL"
          fi
