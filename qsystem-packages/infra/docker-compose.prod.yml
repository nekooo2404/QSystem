services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qsystem}
      POSTGRES_USER: ${POSTGRES_USER:-qsystem}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-qsystem} -d ${POSTGRES_DB:-qsystem}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  migrate:
    image: ${QSYSTEM_API_IMAGE:-qsystem/api:latest}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL_FILE: /run/secrets/rls_owner_url
      JWT_SECRET_FILE: /run/secrets/jwt_secret
    secrets:
      - rls_owner_url
      - jwt_secret
    command: ['node', '/app/apps/api/scripts/migrate-deploy.mjs']

  api:
    image: ${QSYSTEM_API_IMAGE:-qsystem/api:latest}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-production}
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL_FILE: /run/secrets/database_url
      RLS_OWNER_URL_FILE: /run/secrets/rls_owner_url
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
      MEILI_URL: ${MEILI_URL}
      MEILI_MASTER_KEY_FILE: /run/secrets/meili_master_key
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      RATE_LIMIT_STORE: ${RATE_LIMIT_STORE:-redis}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      COOKIE_PATH: ${COOKIE_PATH:-/}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      APP_ORIGIN: ${APP_ORIGIN:-}
      CORS_ORIGINS: ${CORS_ORIGINS}
      BODY_LIMIT: ${BODY_LIMIT:-1mb}
      ENABLED_MODULES: ${ENABLED_MODULES:-qtask,qhrm,qcrm,qsocial,files,notifications}
    secrets:
      - database_url
      - rls_owner_url
      - jwt_secret
      - s3_access_key
      - s3_secret_key
      - meili_master_key
    ports:
      - '127.0.0.1:3001:3001'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  web:
    image: ${QSYSTEM_WEB_IMAGE:-qsystem/web:latest}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        QSYSTEM_API_URL: http://api:3001
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      QSYSTEM_API_URL: http://api:3001
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  pg_data:
  redis_data:

secrets:
  postgres_password:
    file: ${SECRET_DIR:-./secrets}/postgres_password
  database_url:
    file: ${SECRET_DIR:-./secrets}/database_url
  rls_owner_url:
    file: ${SECRET_DIR:-./secrets}/rls_owner_url
  jwt_secret:
    file: ${SECRET_DIR:-./secrets}/jwt_secret
  s3_access_key:
    file: ${SECRET_DIR:-./secrets}/s3_access_key
  s3_secret_key:
    file: ${SECRET_DIR:-./secrets}/s3_secret_key
  meili_master_key:
    file: ${SECRET_DIR:-./secrets}/meili_master_key
